# ── 서버 설정 ─────────────────────────────────
server.port=8080

# ── DataSource ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 콘솔 ───────────────────────────────────
# 브라우저에서 localhost:8080/h2-console 접속 가능
spring.h2.console.enabled=true

# ── JPA ───────────────────────────────────────
# 애플리케이션 시작 시 테이블 생성, 종료 시 삭제
spring.jpa.hibernate.ddl-auto=create-drop
# 실행되는 SQL 로그 출력
spring.jpa.show-sql=true

# ── MyBatis ───────────────────────────────────
spring.mybatis.mapper-locations=classpath:mapper/**/*.xml
spring.mybatis.configuration.map-underscore-to-camel-case=true

# ── Mock PG 설정 ──────────────────────────────
# 승인 성공 확률 (95%)
payment.mock.approval-rate=0.95
# PG사 응답 지연 시뮬레이션 (ms)
payment.mock.processing-delay-ms=300