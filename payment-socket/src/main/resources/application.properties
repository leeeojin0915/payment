# ── DataSource ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ───────────────────────────────────────
# 애플리케이션 시작 시 테이블 생성, 종료 시 삭제
spring.jpa.hibernate.ddl-auto=create-drop
# 실행되는 SQL 로그 출력
spring.jpa.show-sql=true

# ── MyBatis ───────────────────────────────────
# MyBatis XML 위치
spring.mybatis.mapper-locations=classpath:mapper/**/*.xml
# snake_case → camelCase 자동 변환
spring.mybatis.configuration.map-underscore-to-camel-case=true

# ── 소켓 서버 설정 ────────────────────────────
# TCP 소켓 포트
payment.socket.port=9090
# 동시 처리 스레드 수
payment.socket.thread-pool-size=10
# 연결 대기 큐 크기
payment.socket.backlog=50

# ── Mock PG 설정 ──────────────────────────────
# 승인 성공 확률 (95%)
payment.mock.approval-rate=0.95
# PG사 응답 지연 시뮬레이션 (ms)
payment.mock.processing-delay-ms=300